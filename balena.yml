name: browser
description: >-
  a hardware accelerated web browser to present internal and external URLs on a
  connected display

post-provisioning: >-
  ## Usage instructions

  The browser block renders through a companion display (compositor) block.
  Include this snippet in your docker-compose.yml file under 'services', and
  declare the `display-socket` (and, if using PERSISTENT, `settings`) volumes:

    ```
    display:
      image: bh.cr/balenasolutions/display-<arch> # <arch> is aarch64 or amd64; see https://github.com/balenasolutions/display
      privileged: true
      volumes:
        - display-socket:/run
      labels:
        io.balena.features.dbus: '1'

    browser:
      image: bh.cr/balenasolutions/browser-<device-type> # one of raspberrypi3-64, raspberrypi4-64, raspberrypi5, generic-aarch64, generic-amd64
      privileged: true # required for sound (/dev/snd) and V4L2 video-decode (/dev/video*) device access
      depends_on:
        - display
      environment:
        XDG_RUNTIME_DIR: /run/user/0
        WAYLAND_DISPLAY: wayland-0
      devices:
        - /dev/dri:/dev/dri
      ports:
        - '5011:5011' # management API
      volumes:
        - display-socket:/run
        - 'settings:/data' # Only required if using PERSISTENT flag
    ```

    To pin to a specific version of this block, append it to the image, e.g.
    `bh.cr/balenasolutions/browser-<device-type>/<version>`.

    Upgrading from v2? See docs/migrating-from-v2.md in the repository.
version: 3.0.2
type: sw.block
assets:
  repository:
    type: blob.asset
    data:
      url: 'https://github.com/balenasolutions/browser'
  logo:
    type: blob.asset
    data:
      url: 'https://raw.githubusercontent.com/balenasolutions/browser/master/logo.png'
data:
  defaultDeviceType: raspberrypi4-64
  supportedDeviceTypes:
    - raspberrypi4-64
    - raspberrypi3-64
    - raspberrypi400-64
    - raspberrypi5
    - intel-nuc
    - generic-amd64
    - generic-aarch64
