- commits:
    - subject: Keep the Wayland platform flag when FLAGS is set
      hash: abf26bc01a456e093e50ea12ee3cdd09407eddbf
      body: |
        FLAGS replaces the whole flag set, which also dropped
        --ozone-platform=wayland. Chromium then fell back to X11, exited with
        "Missing X server or $DISPLAY", and the block failed with ECONNREFUSED
        on the debug port and restarted in a loop. Add the Wayland flag unless
        FLAGS sets its own --ozone-platform, and document that FLAGS replaces
        the kiosk defaults so additive flags belong in EXTRA_FLAGS.
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: "docs: Restyle the architecture diagram"
      hash: b72be3745d907e1a0918efc88f94e7ee8dfc67f0
      body: |
        Lay out the browser block horizontally and highlight it, mute the other
        groups, and give every node explicit colours so it reads in dark mode.
        Use consistent two-line group titles, label the V4L2 path as H.264
        decode on Pi 3/4 only, and show the Wayland socket without its
        configurable path.
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
