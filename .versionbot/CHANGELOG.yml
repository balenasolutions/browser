      nested: []
    - subject: "docs: Rework readme for v3 and add a v2 to v3 migration guide"
      hash: 804aa7c80b79700a738afec3c1cba096d936ec05
      body: ""
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Run Chromium as a Wayland client instead of X11
      hash: 87c823b98927905cf3a70096a9f5f9b7b6e83b05
      body: |
        The block no longer starts its own X server. Chromium runs with
        --ozone-platform=wayland against the socket that a companion display
        (compositor) block exposes on a shared /run volume.

        - Replace the X11 packages and the startx/Xwrapper setup with the Mesa
          GL/GBM/VA-API drivers
        - Map the host GIDs of /dev/dri, /dev/video* and /dev/snd/* into the
          container so the unprivileged chromium user can use the GPU, V4L2
          video decode and ALSA
        - ENABLE_GPU now enables GPU rendering and best-effort hardware video
          decode; DISABLE_VIDEO_DECODE opts out of decode
        - Add /diagnostics/{version,gpu,media} endpoints, gated behind
          ENABLE_DIAGNOSTICS (off by default)
        - Take /screenshot through the DevTools protocol instead of scrot
        - Move to debian:13.2-slim and chrome-launcher 1.x
      footer:
        Change-type: major
        change-type: major
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
