    - subject: Enable Intel VA-API hardware video decode on generic-amd64
      hash: bf745dea18e276d7b9afb121d29c078fa6fb4df3
      body: |
        mesa-va-drivers only provides VA-API for AMD/gallium, so on Intel
        devices libva exposed zero decode profiles and Chromium fell back to
        software for every codec. Install Intel's own VA driver
        (intel-media-va-driver for Gen8+, i965-va-driver for older parts) on
        amd64; libva auto-selects the right one per GPU.
        Also bundle vainfo and surface its output in the diagnostics report
        (plus a /diagnostics/vainfo endpoint) so VA profiles can be inspected
        directly.
        Verified on i3-7100U (Kaby Lake): H.264 and HEVC now decode via
        VaapiVideoDecoder (hardware: true).
      footer:
        Change-type: minor
        change-type: minor
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Restart Chromium when the display socket is recreated
      hash: de1e80bfd99cf17148e1a77c7844aaa98caf48cf
      body: |
        The display block deletes and recreates the Wayland socket on every
        restart, which left Chromium disconnected. start.sh now supervises the
        session and relaunches it when the socket's inode changes.
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Play audio directly via ALSA instead of the audio block
      hash: 39b5bd3048cd2d5b9dae77f41617e467fc63295c
      body: |
        The image no longer installs the PulseAudio ALSA bridge or sets
        PULSE_SERVER. HDMI and the 3.5mm jack work with no extra container.
        The migration guide shows how to add the audio block back in a derived
        image.
      footer:
        Change-type: major
        change-type: major
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Remove remaining X11 code
      hash: ef6c3999fe04fe50a69d1f080ebb0e32b84bbd69
      body: |
        Delete startx.sh and the unused X.org config for the Raspberry Pi 5.
        ROTATE_DISPLAY, ROTATE_DELAY, TOUCHSCREEN, WINDOW_SIZE, WINDOW_POSITION,
        SHOW_CURSOR and DISPLAY_NUM no longer exist; rotation and resolution
        are now configured on the display block. The migration guide maps the
        old variables to the new ones.
      footer:
        Change-type: major
        change-type: major
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Add a diagnostics report endpoint
      hash: 1552073642d0ed1fcb5bcad085e7a851756693e0
      body: |
        /diagnostics/report returns a single text file with device and host
        info, runtime config, Chromium GPU and media state, and recent block
        and Chromium logs, for attaching to bug reports. Diagnostics move into
        src/diagnostics.js.
      footer:
        Change-type: minor
        change-type: minor
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Remove FORCE_VULKAN
      hash: 464ae5798fb79b814c3876fe06ad41d53ac078a6
      body: |
        Chromium's Vulkan backend does not work with the Ozone Wayland
        platform. The options for bringing it back after v3 are recorded in
        docs/todo-vulkan-wayland.md.
      footer:
        Change-type: major
        change-type: major
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Add opt-in remote debugging via a TCP relay
      hash: aea78cba5e7972d0387c093f3a221593dbed34bb
      body: |
        Chromium binds its DevTools endpoint to localhost only and ignores
        --remote-debugging-address outside headless mode, so mapping the port
        never made it reachable from another host. With ENABLE_REMOTE_DEBUG=1 a
        small TCP relay forwards REMOTE_DEBUG_PORT to Chromium. The relay adds
        no authentication or encryption.
      footer:
        Change-type: minor
        change-type: minor
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
      author: Rahul Thakoor
      nested: []
    - subject: Update supported device types for v3
      hash: 6f03818bc7ec34cbc183c1b0fd31aec670d3d3e7
      body: |
        Drop fincm3 and 32-bit raspberrypi3, add generic-amd64 and
        generic-aarch64, make raspberrypi4-64 the default device type, and
        publish a raspberrypi3-64 block.
      footer:
        Change-type: major
        change-type: major
        Signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
        signed-off-by: rahul-thakoor <13220877+rahul-thakoor@users.noreply.github.com>
